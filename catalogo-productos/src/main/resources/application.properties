spring.application.name=catalogo

# H2 en memoria también para la ejecución local: el objetivo de la unidad
# son las pruebas, no la persistencia contra un motor externo
spring.datasource.url=jdbc:h2:mem:catalogo;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

server.port=8080
